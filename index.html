<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS: телефон в футере/секции не превращать в авто-ссылку; статус-бар в цвет фона -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO-каркас: canonical, robots, ключевые формулы (название + жанр + город + живые выступления) -->
    <link rel="canonical" href="https://ivashkinsan.github.io/Nova_project_site/" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="NOVA PROJECT, джаз-квинтет, джаз, Липецк, живые выступления, концертные программы, атмосферные сеты, музыка для мероприятий"
    />
    <title>NOVA PROJECT — джаз-квинтет из Липецка: живые выступления и атмосферные сеты</title>
    <meta
      name="description"
      content="NOVA PROJECT — джаз-квинтет из Липецка. Авторские программы, атмосферные сеты и живой звук для корпоративов, свадеб, приёмов и фестивалей. Музыка — это диалог между эпохами."
    />

    <!-- Open Graph: абсолютный URL обложки (1200×630), пиксельные атрибуты и alt -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOVA PROJECT" />
    <meta property="og:url" content="https://ivashkinsan.github.io/Nova_project_site/" />
    <meta property="og:title" content="NOVA PROJECT — джаз-квинтет для ваших мероприятий" />
    <meta
      property="og:description"
      content="Музыка — это диалог между эпохами. Концертные программы и атмосферные сеты от джаз-квинтета из Липецка."
    />
    <meta property="og:image" content="https://ivashkinsan.github.io/Nova_project_site/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NOVA PROJECT — джаз-квинтет из Липецка: текстовая обложка сайта" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOVA PROJECT — джаз-квинтет для ваших мероприятий" />
    <meta
      name="twitter:description"
      content="Концертные программы и атмосферные сеты от джаз-квинтета из Липецка. Живые выступления."
    />
    <meta name="twitter:image" content="https://ivashkinsan.github.io/Nova_project_site/og-cover.jpg" />

    <!-- Schema.org: MusicGroup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "NOVA PROJECT",
        "genre": ["Jazz", "Neoclassical", "Fusion"],
        "description": "Джаз-квинтет из Липецка: авторские программы, атмосферные сеты и живые выступления для корпоративов, свадеб, приёмов и фестивалей.",
        "url": "https://ivashkinsan.github.io/Nova_project_site/",
        "image": "https://ivashkinsan.github.io/Nova_project_site/og-cover.jpg",
        "inLanguage": "ru",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Липецк",
          "addressCountry": "RU"
        },
        "sameAs": ["https://vk.com/novaprojekt"]
      }
    </script>

    <!-- Schema.org: живые выступления (жанр, город, форма заявки — без выдуманных дат) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Живые выступления NOVA PROJECT",
        "description": "Джаз-квинтет играет живые выступления в Липецке и области: авторские программы и атмосферные сеты. Заявка на дату — из раздела «Заявка».",
        "@id": "https://ivashkinsan.github.io/Nova_project_site/#live",
        "url": "https://ivashkinsan.github.io/Nova_project_site/#booking",
        "performer": {
          "@type": "MusicGroup",
          "name": "NOVA PROJECT",
          "genre": ["Jazz", "Neoclassical", "Fusion"]
        },
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "location": {
          "@type": "Place",
          "name": "Липецк",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Липецк",
            "addressCountry": "RU"
          }
        },
        "image": "https://ivashkinsan.github.io/Nova_project_site/og-cover.jpg",
        "organizer": {
          "@type": "MusicGroup",
          "name": "NOVA PROJECT",
          "url": "https://ivashkinsan.github.io/Nova_project_site/"
        }
      }
    </script>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- iOS: иконка рабочего стола — монограмма N в палитре (180×180) -->
    <link rel="apple-touch-icon" href="https://ivashkinsan.github.io/Nova_project_site/apple-touch-icon.png" />
    <!-- LCP: hero-подложка поднимается в начало очереди загрузки (absolute-URL, base-путь) -->
    <link
      rel="preload"
      as="image"
      href="https://ivashkinsan.github.io/Nova_project_site/1.jpg"
      sizes="100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифт: единственный источник — stylesheet ниже; preload поднимает запрос в начало очереди -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
