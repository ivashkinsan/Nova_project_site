name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # vite.config.js перекрывает vite.config.ts (Vite загружает .js первым),
      # поэтому в репозитории должен остаться ровно один конфиг. Если .js вернётся,
      # сборка уедет без base и сайт на Pages откроется пустым — падаем раньше.
      - name: Проверка единственного конфига Vite
        run: |
          if [ -f vite.config.js ]; then
            echo "::error::Найден vite.config.js — он перекрывает vite.config.ts. Удалите его (git rm vite.config.js), либо перенесите base в него и удалите vite.config.ts."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pages нужно включить один раз вручную: Settings → Pages → Source: GitHub Actions.
      # Автоматически включить нельзя: у токена Actions нет прав на создание сайта
      # (HttpError: Resource not accessible by integration), поэтому enablement убран.
      # Шаг ниже лишь проверяет, что Pages уже включён, и падает с понятным текстом.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # В репозитории нет lock-файла: pnpm-lock.yaml в .gitignore, package-lock.json
      # не коммитился. Поэтому `npm ci` и `cache: npm` здесь не работают —
      # оба требуют lock-файл и падают ещё до сборки.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
